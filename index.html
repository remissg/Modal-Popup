<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal/Popup System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Theme Toggle -->
    <button id="themeToggle" class="theme-btn">🌙</button>

    <div class="container">
        <h1>Modal / Popup System</h1>

        <div class="button-group">
            <button class="open-modal-btn" data-modal="modal1">Open Info Modal</button>
            <button class="open-modal-btn" data-modal="modal2">Open Form Modal</button>
            <button class="open-modal-btn" data-modal="modal3">Open Image Modal</button>
        </div>
    </div>

    <!-- Overlay -->
    <div id="overlay" class="overlay"></div>

    <!-- Modal 1 -->
    <div id="modal1" class="modal">
        <div class="modal-header">
            <h2>Information</h2>
            <span class="close-btn">&times;</span>
        </div>
        <p>This is a beautifully animated modal with blur effect and dark mode support.</p>
    </div>

    <!-- Modal 2 -->
    <div id="modal2" class="modal">
        <div class="modal-header">
            <h2>Contact Form</h2>
            <span class="close-btn">&times;</span>
        </div>
        <form>
            <label>Name</label>
            <input type="text" placeholder="Enter your name">

            <label>Email</label>
            <input type="email" placeholder="Enter your email">

            <button class="submit-btn">Submit</button>
        </form>
    </div>

    <!-- Modal 3 -->
    <div id="modal3" class="modal">
        <div class="modal-header">
            <h2>Beautiful Image</h2>
            <span class="close-btn">&times;</span>
        </div>
        <img src="https://picsum.photos/400" alt="Random Image" class="modal-img">
    </div>

    <script src="script.js"></script>
</body>

</html>
